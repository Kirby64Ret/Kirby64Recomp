name: Kirby 64 Recomp Build CI

on:
  push:
    branches: [ dev ]

jobs:
  build-linux:
    runs-on: [self-hosted, Linux, X64, Ubuntu]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y gcc clang git python3
    - name: Get the dependency
      run: cp /etc/kirby64/* NK4E.z64
    - name: Build Recomp
      run: make -j8
    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: Kirby 64 Recompiled Launcher (Ubuntu 26.04)
        retention-days: 1
        path: |
          build/Kirby64Recompiled
          recompcontrollerdb.txt
          assets/README.txt

  build-windows:
    runs-on: [self-hosted, X64, Windows]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Get the dependency
      run: cp C:\NK4E.z64 .
    - name: Build Recomp
      run: |
        mkdir build/N64Recomp
        cmake -B build\N64Recomp -S N64Recomp -G Ninja
        ninja -C build\N64Recomp -j8
        .\build\N64Recomp\N64Recomp NK4E.toml
        .\build\N64Recomp\RSPRecomp n_aspMain.toml
        cmake -B build -S . -G Ninja
        ninja -j8 -C build
    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: Kirby 64 Recompiled Launcher (Windows 11)
        retention-days: 1
        path: |
          build/Kirby64Recompiled.exe
          recompcontrollerdb.txt
          assets/README.txt
