name: Kirby 64 Recomp Build CI

on:
  push:
    branches: [ dev ]

jobs:
  build-linux:
    runs-on: [self-hosted, Linux, X64, Ubuntu]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y gcc clang git python3
    - name: Get the dependency
      run: cp /etc/kirby64/* NK4E.z64
    - name: Build Recomp
      run: make -j8
    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: Kirby 64 Recompiled Launcher (Ubuntu 26.04)
        retention-days: 1
        path: |
          build/Kirby64Recompiled
          recompcontrollerdb.txt
          assets/README.txt

  build-windows:
    runs-on: [self-hosted, X64, Windows]
    strategy:
      matrix:
        type: [ RelWithDebInfo ]
    name: windows (${{ matrix.type }})
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          submodules: recursive
      - name: Add select dependencies to path
        run: |
          echo "C:\Program Files\Git\bin" >> $env:GITHUB_PATH
          echo "C:\Program Files\7-Zip" >> $env:GITHUB_PATH
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ runner.os }}-kirby64ret-ccache-${{ matrix.type }}
      - name: Download portable LLVM
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.3/LLVM-19.1.3-Windows-X64.tar.xz" -OutFile "LLVM.tar.xz"
          New-Item -ItemType Directory -Path portable-llvm > $null
          7z x LLVM.tar.xz
          7z x LLVM.tar -oportable-llvm
      - name: Configure Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
      - name: Prepare Build
        run: cp C:\NK4E.z64 .
      - name: Build N64Recomp & RSPRecomp
        run: |
          # enable ccache
          set $env:PATH="$env:USERPROFILE/.cargo/bin;$env:PATH"
          # $cpuCores = (Get-CimInstance -ClassName Win32_Processor).NumberOfLogicalProcessors
          $cpuCores = 1

          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_MAKE_PROGRAM=ninja -G Ninja -S N64Recomp/ -B build/N64Recomp
          cmake --build build/N64Recomp --config Release --target N64RecompCLI -j $cpuCores
          cmake --build build/N64Recomp --config Release --target RSPRecomp -j $cpuCores

          # Copy N64Recomp & RSPRecomp to root directory
          cp build/N64Recomp/N64Recomp.exe .
          cp build/N64Recomp/RSPRecomp.exe .
      - name: Run N64Recomp & RSPRecomp
        run: |
          ./N64Recomp.exe NK4E.toml
          ./RSPRecomp.exe n_aspMain.toml
      - name: Build Kirby 64 Recomp Launcher
        run: |-
          # enable ccache
          set $env:PATH="$env:USERPROFILE/.cargo/bin;$env:PATH"
          $cpuCores = (Get-CimInstance -ClassName Win32_Processor).NumberOfLogicalProcessors

          # remove LLVM from PATH so it doesn't overshadow the one provided by VS
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -ne 'C:\Program Files\LLVM\bin' }) -join ';'

          cmake -DCMAKE_BUILD_TYPE=${{ matrix.type }} -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_C_COMPILER=clang-cl -DCMAKE_MAKE_PROGRAM=ninja -DPATCHES_C_COMPILER="..\portable-llvm\LLVM-19.1.3-Windows-X64\bin\clang" -DPATCHES_LD="..\portable-llvm\LLVM-19.1.3-Windows-X64\bin\ld.lld" -G Ninja -S . -B build -DCMAKE_CXX_FLAGS="-Xclang -fexceptions -Xclang -fcxx-exceptions"
          cmake --build build --config ${{ matrix.type }} --target Kirby64Recompiled -j $cpuCores
        env:
          SDL2_VERSION: 2.30.3
      - name: Prepare Archive
        run: |
          Move-Item -Path "cmake-build/Kirby64Recompiled.exe" -Destination "Kirby64Recompiled.exe"
          Move-Item -Path "cmake-build/dxcompiler.dll" -Destination "dxcompiler.dll"
          Move-Item -Path "cmake-build/dxil.dll" -Destination "dxil.dll"
          Move-Item -Path "cmake-build/SDL2.dll" -Destination "SDL2.dll"
          Move-Item -Path "cmake-build/Kirby64Recompiled.pdb" -Destination "Kirby64Recompiled.pdb"
          Remove-Item -Path "assets/scss" -Recurse -Force
      - name: Upload Kirby64 Recomp Launcher
        uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: Kirby64Recompiled-${{ runner.os }}-${{ matrix.type }}
          path: |
            Kirby64Recompiled.exe
            dxcompiler.dll
            dxil.dll
            SDL2.dll
            assets/
            recompcontrollerdb.txt
      - name: Archive Debug Files
        uses: actions/upload-artifact@v7
        with:
          retention-days: 1
          name: Kirby64Recompiled-PDB-${{ matrix.type }}
          path: |
            Kirby64Recompiled.pdb